#   raw / cooked_into: needs cooking to be safe
#   pathogen / pathogen_chance: germs this kind of food may carry
#   toxin / toxin_amount: poison in the whole item (1.0 amatoxin ~ lethal)
#   true_name: what an expert would call it (shown with a field guide)

