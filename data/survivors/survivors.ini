wear = tshirt, cardigan, rain_jacket, jeans, sneakers
weapon = kitchen_knife
carry = disinfectant:2, bandage:2, painkillers:1, crispbread:2, bottled_water:1, farm_report:1
hp = 50
greet = Stop - are you sick? Fever, rash, bleeding from the gums? ...No? Then come in. Sorry. I'm Maja. I used to be a scientist.
hello = Hi. Have you been washing your hands? I'm joking. Mostly.
chat = I sleep in the lab. It's the only place where I know what everything is.|Whatever it was, it doesn't seem to touch us. I don't know why. That's the worst part, not knowing why.|Elin from ward four used to bring me coffee. Have you seen her?|I boil everything now. Water, bandages, my own hands, nearly.
want = lab_notes
want_count = 1
want_text = My notebook. When it started I ran from the top floor - the old lab, floor two - and I left it in one of the cabinets up there. Everything I worked out is in there. If you find it - please.
want_place = at:3589,2663
want_place_level = 2
want_place_name = Maja's lab notes
thanks = My notes. Oh, thank God. Here - this came in with the last batch of samples. I wasn't supposed to read it. I think you should.
reward = farm_report:1, antibiotics:1, bandage:2
leads = anders, elin
lead_text = The priest at Christinae kyrka is still ringing the bell on Sundays. Anders. And Elin from ward four - she lives a few streets from the start of Sörhaga.
can_join = true
join_trust = 45
join_text = Yes. I can't look at those samples any more. Let's go.
refuse_text = Not yet. I need to finish what I'm working on. I need to understand it.
describe = A scientist who lives in the lab at the lasarett. Knows more about the virus than anyone left.
gender = woman
hair_style = 2
happened = The samples came in labelled "U-7". Blood, saliva, soil, grain. I ran them like any other job. It was only when I put them under the scope that I saw what it was - and that it was in everything. It moves by touch, by air, by water, by blood. There's no route it can't take.|The farmer's samples stopped coming on day three. I looked at the date of the grain samples, and the mill they came from, and I understood where the bread in my own kitchen came from. By the time I'd written it down, they were reporting cases in Göteborg. Eight days. That's all it took.
happened_lore = the_spread|eight_days
about = I grew up in Lerum. My dad drove the commuter train.|I wanted to cure things. That's why I went into microbiology. Isn't that funny.|I wasn't brave. I just stayed because I didn't know where else to go.
friend_chat = I've been trying to work out why we're immune. You, me, Elin. Something in common. I'll find it.|When this is over I'm going to plant something. Anything. I want to watch something grow that isn't in a dish.
close_chat = You're the only one I've told about the samples. All of it. Thank you for not looking at me like I did it.|I used to think the world ended with a bang. It ended with a stamp on a form.
lover_chat = I never planned anything past next week. Now I think about next year, with you.|Come here. Let me check your hands. ...No reason. I just wanted to hold them.
idle = Plate four, no growth... plate five...|Where did I put the pipettes. Where did I put my life.|Don't think about it. Label the sample.
night = Who's - oh. Oh, it's you. I fell asleep at the microscope again.|Is it morning? It's not morning.
morning = *rubs her eyes* Coffee. Is there coffee? There's never coffee.
flirt_yes = That's... very unscientific of you. Say it again.|I'm blushing. I can feel it. Stop that. Don't stop that.
confess_yes = I've been running the numbers on that for weeks. Same result every time. Yes.
bedtime = 0
wakeup = 7

[lars_erik]
name = Lars-Erik Holm
age = 64
bio = A farmer at Bälinge who drove grain for the cooperative on the side. His last load came down from a mill in Uppland.
disposition = wary
home = district:Bälinge
roam = 14
skin = #d8a888
hair = #b0aca4
wear = flannel_shirt, overalls, work_jacket, rubber_boots, wool_hat
weapon = axe
carry = potato_raw:4, butter:1, bread_loaf:1, matches:2, rope:1
hp = 65
greet = That's my land you're standing on. ...Well. I suppose it's everybody's land now. What do you want?
hello = It's you. Wipe your boots.
chat = The cows broke out of the barn when nobody came to milk them. I see them in the woods sometimes.|Never eat bread you didn't bake yourself. I'll say no more.|The tractor still runs. Nowhere to drive it, mind.|Saw lorries go into the Hjortmarka woods, the day before it all went quiet. Army lorries.
want = hose
want_count = 1
want_text = There's diesel in the old tank behind the barn and nothing to get it out with. Bring me a length of hose.
thanks = That'll do nicely. Here - for your trouble. And since you've earned it, I'll tell you about those lorries.
reward = potato_raw:4, butter:1, bread_loaf:1
leads = henrik, oskar
lead_text = The day before it all went quiet, three army lorries drove into Hjortmarka and came out empty. Nobody puts a bunker in the woods for nothing. There's somebody down there still - I've seen the light from the vent at night. And there's a lad in a soldier's jacket living in a summer cottage out by Maryd. Oskar. He knows something about the army's business in the woods, but he won't say what.
can_join = false
refuse_text = I was born on this farm. I'll be buried on it.
describe = An old farmer out at Bälinge with an axe and opinions about bread.
gender = man
hair_style = 0
romanceable = false
happened = My cousin farmed up in Uppland. Rang me a month before, said there was a farm near him where nobody could get in. Cars broke down on the road. The phone man's van went in a ditch. Men in a white car watching from the field edge all day. He thought they were from the EU, checking subsidies.|I hauled grain for the cooperative. My last load came down from a mill in Uppland, the week it started. I drove it to the bakeries in Göteborg myself. I've thought about that every day since. Every single day.
happened_lore = the_farm|the_spread
about = Forty-one harvests on this farm. My father's before me.|My wife Gun-Britt went to her sister's in Borås that week. I don't know. I don't drive over there to find out.|I'm not a talker. Ask the cows.
friend_chat = You can have the potatoes in the third row. The second row's mine.|The swallows left early this year. They knew something.
idle = Come on, you old Volvo.|Rain tomorrow. Knee says so.|Forty-one harvests.
night = Who's in my yard?! I've got the axe!|Bloody hell. It's the middle of the night.
morning = *spits* Weather's turning.
bedtime = 21
wakeup = 5

