wear = tshirt, hoodie, down_jacket, jeans, hiking_boots, balaclava
weapon = shotgun
carry = shotgun_shells:2, chocolate:3, vodka:1, playing_cards:1, energy_drink:2
hp = 70
aim = 0.5
warn = There you are!|Hey! Drop the bag!|Get them!
describe = Blond, a balaclava, a shotgun. He and Robin go everywhere together.

[robin]
name = Robin Ek
age = 24
bio = Kalle's friend. Quieter, and quicker with the machete.
disposition = raider
home = building:Vimpeln
partners = kalle
skin = #d8b090
hair = #2a1a10
wear = tshirt, fleece, rain_jacket, sweatpants, sneakers, cap
weapon = machete
carry = canned_beans:2, peanuts:1, bandage:1, lighter:1
hp = 60
warn = Over here!|Don't run!|Nice boots. I'll have them.
describe = Quick, with a machete. Never far from Kalle.

[dennis]
name = Dennis
age = 37
bio = A loner who hunts people in the Noltorp woods with a bow.
disposition = raider
home = district:Noltorp
route = district:Noltorp;district:Enehagen;district:Kvarnbacken
skin = #e0bc9c
hair = #5a4030
wear = thermal_top, wool_sweater, rain_jacket, rain_pants, winter_boots, balaclava
weapon = hunting_bow
carry = arrows:6, jerky:2, venison_raw:1, purification_tablets:1
