# --- People who know something about how it ended (data/text/lore.ini) ---

[henrik]
name = Henrik Ståhl
age = 58
bio = A state secretary from the Ministry of Defence. He was handed a sealed order a week before the end, and he took it.
disposition = hostile
home = building:Skyddsrum Hjortmarka
roam = 5
skin = #e4c2a4
hair = #9a9690
wear = thermal_top, wool_sweater, down_jacket, jeans, hiking_boots
weapon = pistol
carry = pistol_ammo:3, canned_meatballs:3, bottled_water:2, batteries:1, evacuation_order:1
hp = 55
aim = 0.45
freeze = FREEZE! Don't come one step closer to this door!|Stop right there! Hands up - both of them!
warn = This is a protected installation. Turn around!|I'm armed and I'm not alone in here! Leave!
greet = ...You're alive. You're actually alive. Don't touch anything. Don't touch me. Have you had a fever? Any cough? Who sent you?
parley = All right. All right. Stay where you are. I haven't spoken to a living person in weeks.
let_in_trust = 20
let_in = Get in, quickly, before the air... no. It doesn't matter any more, does it. Come in.
keep_out = No. The filters are the only thing between me and what's out there. You stay outside.
hello = You came back. Close the door behind you. Old habits.
chat = The air filters hum all night. You stop hearing them, then you can't sleep without them.|There were supposed to be twelve of us down here. I was the only one who made it to the door.|I keep the radio on the government channel. It plays a test tone. Just the tone.|Don't go into Stockholm. Whatever you hear. Don't go.
want = batteries
want_count = 4
want_text = The backup for the air filters runs on cells like these. When the main power dies, it's those or nothing. Four packs.
thanks = Thank you. You don't know what that means down here. Take this - I've read it enough times. Everyone should know.
reward = test_schedule:1, rifle_ammo:1, canned_meatballs:2
leads = maja
lead_text = The analyses for the last test went through a contract lab. One of their people worked out of the lasarett here in Alingsås. Lind, I think. If she's alive, she knows more than I do about the virus itself.
describe = A man in a government shelter in the forest at Hjortmarka. Paranoid, and armed.
gender = man
hair_style = 0
romanceable = false
happened = I was in the room. Not at the table - behind it, with the folders. The UN called everyone in, and the scientists gave them two choices. Shut down every plastic plant, every petrol car, every coal and oil plant. Or lose eighty percent of the civilian population. Most of them wouldn't even say the second option out loud.|The minutes were sealed. Then they weren't. A company called Veyra Systems got into the system - a data breach, they said, like a stolen password. Veyra read option two and saw a contract. And they found friends. The biggest companies in the world, quietly.|They tested for twenty years. Gas over New York in 2006. Water in Berlin in 2012. The first virus over Beijing in 2020. The second over Stockholm, this year. We had the schedule. We had it, and we filed it.|A week before the end, some of us got envelopes. Report to shelter. Bring nothing. Tell no one. I didn't tell my wife. I think about that every hour.
happened_lore = un_meeting|the_breach|the_tests|the_bunkers
about = Thirty years in the ministry. I wrote the rules for shelters like this one. I never thought I'd sleep in one.|My wife's name was Lena. She thought I was at a conference in Brussels.|I was a good civil servant. I filed things. I filed this.
friend_chat = I count the tins every morning. One hundred and forty. Then I count them again.|You're the first person in weeks who hasn't been a voice on a recording.|If I had told people. If any of us had told people.
idle = Filter one, green. Filter two, green. Filter three...|Test tone. Still the test tone.|One hundred and forty. One hundred and forty.
night = WHO'S THERE?! How did you get in?!|You. In the middle of the night. God, my heart.
morning = *stares at the ceiling* Another day under the trees.
bedtime = 23
wakeup = 5

[maja]
name = Maja Lind
age = 33
bio = A microbiologist who analysed blood samples for a contract lab at the lasarett. She didn't know what the samples were for until it was too late.
disposition = friendly
home = at:3589,2663:Alingsås lasarett
roam = 10
skin = #f0d2b8
