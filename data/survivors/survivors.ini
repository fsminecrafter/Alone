# The people still in Alingsås.
#
#   disposition  friendly | wary | hostile | raider
#   home         building:<name> | district:<name> | at:x,y:<name> (the building at
#                that spot, metres) | start:<metres> (a house about
#                that far from where you wake up) | x,y (metres)
#   route        raiders: places they walk between, separated by ;
#   wear         clothing item ids; weapon: item id; carry = id:count, ...
#   want / want_count / want_text / thanks / reward / teaches: their one request
#                (want = item id, or tag:<tag> for anything with that tag)
#   leads        who they tell you about once they trust you (ids)
#   can_join / join_trust: whether, and when, they'll come with you
#   Lines can use | to give several alternatives, and {name} for your name.
#   gender = man | woman | other; hair_style 0 short, 1 long, 2 ponytail, 3 bun, 4 shaved
#   about: their story, one piece (|) at a time as they trust you more
#   friend_chat / close_chat / lover_chat: chat once you're friends / best friends / together
#   idle (muttered at home), night (woken up), morning (just up)
#   freeze (hostile): shouted when they first see you, before walking up to you
#   want_place / want_place_level / want_place_name: where the story put what they want
#                (at:x,y, a floor: -1 basement, 1-2 upstairs); marked on your map when they ask
#   romanceable (adults by default), flirt_yes / flirt_no / confess_yes / confess_no, family_text
#   bedtime / wakeup: hours they sleep (Jonas barely does)
#   Lines nobody has of their own come from data/text/dialogue.ini

[elin]
name = Elin Berg
age = 34
bio = A nurse from the hospital. She stayed when the others left, then the hospital emptied too.
disposition = friendly
home = start:260
roam = 6
skin = #e6c0a0
hair = #b88a4a
wear = rain_jacket, jeans, wool_sweater, rubber_boots
weapon = kitchen_knife
carry = bandage:3, disinfectant:1, painkillers:1, crispbread:2, canned_soup:1
hp = 55
greet = Oh! Oh my god, a person. I saw you walking past yesterday and thought I'd imagined you. I'm Elin.
hello = It's good to see you. Really.
chat = I keep the candles low at night. I don't know who else is out there.|I worked on ward 4 at the lasarett. There's still medicine there, if you're brave.|Some days I talk to myself just to hear a voice.|Boil the water from the lake. Ten minutes rolling. Promise me.|I put a mark on the door of every house I check. A little cross. There are a lot of crosses now.
want = can_opener
want_count = 1
want_text = I've got a cupboard full of tins and nothing to open them with. I've been stabbing them with a screwdriver. A can opener would change my life.
thanks = A can opener! You have no idea. Here, take some of my dressings - you're the one walking around out there.
reward = bandage:2, painkillers:1
leads = gunnar, sofia, maja
lead_text = There's an old man in Nolby with an antenna on his roof - Gunnar. And a girl hides in the library, I've seen her light.
can_join = true
join_trust = 45
join_text = Yes. God, yes. I can't do another winter alone in this house.
refuse_text = I... don't know you well enough yet. Not yet.
describe = A nurse. Kind, and good with wounds.
gender = woman
hair_style = 2
about = I grew up in Sollebrunn. Moved to Alingsås for the nursing job and never left.|I had a husband. Mattias. He went to Göteborg the week it started, to find his mother. He never called.|On the last night at the hospital there were four of us left, and twelve patients. I don't talk about the morning after.|I used to hate night shifts. Now every night is a night shift.|I keep a notebook of everyone I treated. So someone remembers them.
happened = I was on shift when the first ones came in from Göteborg. Fever, then nothing - they just stopped. Day three we had a hundred. Day five there was nobody left to admit them. Day eight I was the only one walking the corridors. Eight days, {name}. A whole hospital in eight days.
happened_lore = eight_days
friend_chat = If you get a deep cut, clean it before you do anything else. Infection kills more people than wounds do.|I've started knitting again. Badly. Want a scarf with one sleeve?|I found Mattias's jumper in the wardrobe. It still smells of him. I put it back.
close_chat = You're the first person I've let see me cry since it happened.|Promise me you'll come to me when you get hurt. Not after. When.|Some nights I pretend you're just at work, and you'll be back in the morning. And then you are.
lover_chat = I never thought I'd feel like this again. Not after Mattias. Not after everything.|When you're out there, I keep the bandages ready. Just in case. Every day.|Stay tonight. Please.
idle = Bandages, three... iodine, one...|Where's my good scissors?|Ward four, bed six... no. Stop it, Elin.
night = Wh- who's there? I've got a scalpel!|Oh god. Oh - it's you. You scared me to death.
morning = *yawns* I dreamt I was back on the ward.|Morning. Did you sleep at all?
flirt_yes = *blushes* Nurses aren't supposed to be flustered. You're breaking the rules.|Oh, stop. ...Well, maybe don't stop.
flirt_no = That's sweet. But I'm still wearing my wedding ring, see?
confess_yes = I've been waiting for you to say that. I didn't dare. Yes. Me too.
family_text = Family. I'd given up on having that again. Come here, you.
bedtime = 22
wakeup = 6

[gunnar]
name = Gunnar Lindqvist
age = 71
bio = A retired electrician and radio amateur who has been listening to the static for weeks.
disposition = wary
home = district:Nolby
roam = 4
skin = #e8c4a8
hair = #c8c8c4
wear = flannel_shirt, wool_sweater, work_jacket, jeans, winter_boots, wool_hat
weapon = hunting_rifle
carry = rifle_ammo:2, batteries:1, coffee:2, crispbread:3, pickled_herring:1
hp = 50
aim = 0.75
greet = That's close enough. Keep your hands where I can see them. ...You're not with those two from Vimpeln, are you?
hello = Hm. You again.
chat = Two men with a shotgun go through the shops by Vimpeln. Stay away from there.|The radio's been quiet. But quiet isn't the same as nobody.|Mind the police station. Somebody's holed up in there and he shoots first.|The rain gauge says forty millimetres this week. Wettest October since 1998.|Keep your powder dry. Literally. Damp cartridges misfire.
want = batteries
want_count = 3
want_text = My receiver eats batteries. Bring me three packs and I'll make it worth your while.
thanks = Good. Now I can keep listening. Here - I won't need these as much as you will. And let me show you something about cars.
reward = rifle_ammo:1, wool_hat:1
teaches = hotwire
leads = ahmed, kalle, robin, jonas, lars_erik
lead_text = A mechanic, Ahmed, keeps to the Preem station out in Hedvigsberg. Good man. And keep away from the two raiders round Vimpeln - and the one in the police station.
can_join = false
refuse_text = I'm seventy-one and this is my house. I'm not going anywhere.
describe = An old man with a radio and a rifle. Grumpy, but fair.
gender = man
hair_style = 0
romanceable = false
about = Forty years an electrician. Wired half the houses in Nolby, and the church hall.|My wife Inger died the winter before all this. I suppose she was spared it.|The radio was my hobby. Now it's my job. Somebody has to listen.|I was in the Home Guard in the seventies. I can still take a rifle apart blind.|My son lives in Malmö. Lived. I don't know which.
happened = Two days before the end there was a broadcast on a military frequency. Numbers, then a name, then a map reference. I wrote it down. It was east of here - out in the Hjortmarka woods. Somebody important went to ground out there, mark my words.
happened_lore = the_bunkers
friend_chat = You want to know how to get power from a car battery? Sit down, I'll draw it.|Inger would have liked you. She liked anyone who didn't talk too much.|I heard a voice on 80 metres last Tuesday. Polish, I think. Then nothing.
close_chat = I'm old, I don't say things like this. But I'm glad you knock on my door.|If I go before you, the radio's yours. Keep listening.
idle = Come on, you old relic... there.|Static. Always static.|Inger, where did you put the... hm.
night = Who's that?! I've got the rifle right here!|Bloody hell. You. It's three in the morning.
morning = *coughs* Kettle. Where's the kettle.
bedtime = 23
wakeup = 5

[sofia]
name = Sofia Nyström
age = 19
bio = A student who moved into the library because it has thick walls and something to read.
disposition = friendly
home = building:Alingsås bibliotek
roam = 8
skin = #f0d0b8
hair = #2a1e18
wear = hoodie, jeans, sneakers, wool_hat
weapon = hockey_stick
carry = comic:1, chocolate:2, candles:1, field_guide:1, carpentry_book:1
hp = 45
greet = Don't - wait, you're real? Sorry. I'm Sofia. I've been reading so much I thought you were a character.
hello = Hi! Did you find anything good out there?
chat = I read the whole survival shelf. Twice. Ask me about mushrooms.|The heating's gone. I sleep between the shelves in four blankets.|Do you think anyone's coming for us?|There are mushroom guides on 4B. Don't eat anything white. Just don't.|I found a guitar in the staff room. I can play three chords. Badly.
want = tag:antibiotic
want_count = 1
want_text = I cut my hand on a window a week ago and it's gone red and hot. I think I need antibiotics. The pharmacy or the hospital might have some.
thanks = Thank you. Thank you. Here - the carpentry book, I've read it. And I'll teach you which mushrooms won't kill you.
reward = carpentry_book:1, survival_guide:1
teaches = mushrooms
leads = britt
lead_text = A woman comes down from the forest by Enehagen sometimes, with a rifle and a hare over her shoulder. Britt-Marie, she said.
can_join = true
join_trust = 40
join_text = Okay. Okay! I'll bring the books.
refuse_text = Maybe. Let me get to know you first.
describe = A young student. She has read every book in the building.
gender = woman
hair_style = 1
about = I was studying to be a librarian. Ironic, isn't it? Now I'm the only one.|My parents are in Borås. Or were. I tried to walk there in the first week and turned back at Sandared.|I've read three hundred and twelve books since it happened. I keep a list.|I'm scared of the dark. Don't tell anyone. Not that there's anyone to tell.|I want to write it all down. What happened. For whoever comes next.
happened = Before the internet went down there was a document going round the forums. Minutes from some UN meeting - leaders choosing between shutting down every factory and car, or getting rid of most of the people. Everyone said it was fake. I saved a copy. I don't think it was fake.
happened_lore = un_meeting
friend_chat = Have you read Moomin? Moominvalley in November is basically about us.|I made a reading corner by the window. You can borrow it. The corner, I mean.|You know, half the survival books contradict each other. I'm writing a better one.
close_chat = You're my best friend. Is that childish? I don't care.|When I'm with you I forget to be scared of the dark.|If I write my book, you're in it. You're the hero, obviously.
lover_chat = I used to read love stories and roll my eyes. Now look at me.|Read to me tonight? Any book. I just want to hear your voice.|You're my favourite chapter.
idle = ...and then the wolf said... no, that's not it.|Shelf 4B. Survival. Again.|Three hundred and thirteen.
night = *screams* - oh my god. Oh my god, it's you. My heart.|Is it the raiders?! ...Oh. It's you.
morning = Five more pages. Then I'll get up.
flirt_yes = *hides behind a book* You can't just say things like that!|That's - okay, that's the nicest thing anyone's said to me in months.
flirt_no = Oh! Um. I think of you more like... a big sibling? Sorry!
bedtime = 23
wakeup = 8

[ahmed]
name = Ahmed Karimi
age = 41
bio = A car mechanic who lives in the back of the Preem station and keeps the generator running.
disposition = friendly
home = building:Preem
roam = 10
skin = #b8865e
hair = #1a1410
wear = tshirt, overalls, work_jacket, hiking_boots, gloves
weapon = crowbar
carry = gas_can:1, screwdriver:1, duct_tape:1, energy_drink:2, jerky:2, nails:1
hp = 70
greet = Salaam - hello! Another one! I was beginning to think it was only me and the crows. Ahmed.
hello = My friend! Come, sit.
chat = Most cars still have petrol. The keys, that's the problem.|If you find a bike, take it. Quiet, never runs out of fuel.|I hear an engine at night sometimes, out by Vimpeln. Not a good engine.|Diesel keeps better than petrol. Remember that for winter.|The generator is my baby. Loud baby. Hungry baby.
want = plank
want_count = 6
want_text = The shop windows here - anyone could walk in. Bring me six planks and I'll board them up.
thanks = Beautiful. Now I sleep. Take the gas can, it's full. And if you have a screwdriver, I'll show you how to start a car without a key.
reward = gas_can:1, screwdriver:1
teaches = hotwire
leads = kalle, robin
lead_text = Two men drive around in a black Volvo with a shotgun. They took everything from the Willys. They will take from you too.
can_join = true
join_trust = 55
join_text = Why not? The generator can look after itself. Let's go.
refuse_text = Not yet, my friend. Help me here first.
describe = A mechanic. He knows everything about cars.
gender = man
hair_style = 0
about = I came to Sweden in 2009. Kabul, then Malmö, then Alingsås. I fixed cars in all three.|My wife and daughters were visiting her sister in Uppsala when it started. I tell myself they're safe there.|This station - I was going to buy it. I had the papers ready. Now it's mine anyway. Funny.|I pray five times a day. Some days only three. God understands, I think.|My daughter Leyla wanted to be an engineer. I keep her drawings in the office.
friend_chat = Listen - a cold engine, you choke it. Like this. Remember.|I miss tea with cardamom. Proper tea. If you find cardamom, I'll cook you dinner.|In Kabul we used to say: a friend is a road, an enemy is a wall.
close_chat = You are like a brother to me now. No - more. A brother argues more.|When my family comes back, I want them to meet you. They'll love you.
lover_chat = My heart is too big for this small station, now that you're in it.|Sit with me. Let the generator hum. That's all I need.
idle = Ten millimetre... where's my ten millimetre...|Come on, baby, start for me.|Bismillah.
night = Who's there?! I have a crowbar and I'm not afraid to - oh. It's you, my friend.|*groans* The generator again? No? Then why...
morning = Sabah al-khair. Good morning. Tea? No tea. Water, then.
flirt_yes = Ha! You make an old mechanic blush. Careful.
flirt_no = My friend, my heart is in Uppsala. I'm sorry.
bedtime = 23
wakeup = 6

[britt]
name = Britt-Marie Ek
age = 58
bio = A hunter who lives in a cottage at the edge of the forest and has no intention of coming into town.
disposition = wary
home = district:Enehagen
roam = 14
skin = #dcb08c
hair = #8a7a6a
wear = flannel_shirt, wool_sweater, rain_jacket, rain_pants, rubber_boots, cap
weapon = shotgun
carry = shotgun_shells:2, hare_raw:1, boar_fat:2, venison_raw:2, snare_wire:2
hp = 65
aim = 0.8
greet = Stop there. ...You're not from round here, by the look of you. What do you want?
hello = Mm. It's you.
chat = Lean meat alone will starve you. Eat the fat too.|The boar have got bold since the people left. Don't run from them.|Moose are in rut now. Keep away from the bulls.|Wind's turning north. Snow within the week, you mark my words.|Never walk into the forest without telling someone where. Well. Tell me, then.
want = shotgun_shells
want_count = 2
want_text = I'm down to my last cartridges. Two boxes of shells and you can have meat whenever you need it.
thanks = That's more like it. Here - fat and venison. And keep the knife, I've got three.
reward = hunting_knife:1, boar_fat:2, venison_raw:2
can_join = false
refuse_text = Me? In a group? Ha.
describe = A hunter who knows the forest like the back of her hand.
gender = woman
hair_style = 3
about = Been hunting since I was nine. My father taught me on Hjortmarka. Same ridges I walk today.|Never married. Had a dog, Bamse. Best company I ever kept. He died in the summer.|I worked at the sawmill for thirty years. My hands remember the noise.|I never liked town. Now there's no town to like, so I'm not missing much.|My brother's in Norrland. If anyone's fine, it's him. Stubborn as a stump.
friend_chat = Snares by the hare runs, not in the open. Look for the little paths in the grass.|You can eat roe deer liver raw if you're desperate. Fresh, mind.|Tallow candles stink but they burn. Keep that in mind.
close_chat = I've never had much use for people. You're the exception. Don't make a fuss about it.|Bamse would have liked you. He had good taste.
lover_chat = Never thought I'd go soft at fifty-eight. Look what you've done.|Stay for supper. There's venison. There's always venison.
idle = Hm. Need more wire.|Bamse... no. Not any more.|Oil the gun. Oil the gun.
night = *click of a shotgun* Speak. Now.|What in God's name... you? In my cottage? At night?
morning = Dawn's the best time for deer. You're keeping me from it.
flirt_yes = *snorts* Flattery won't get you more venison. ...It might.
flirt_no = Ha! You're barking up the wrong tree. Go on with you.
bedtime = 21
wakeup = 5

[jonas]
name = Jonas Wikström
age = 46
bio = A security guard who barricaded himself into the police station with its gun safe.
disposition = hostile
home = building:Polisen Alingsås
roam = 5
skin = #e0b896
hair = #3a2a20
wear = tshirt, wool_sweater, reflective_vest, jeans, hiking_boots
weapon = pistol
carry = pistol_ammo:3, canned_meatballs:2, bandage:1, flashlight:1
hp = 75
aim = 0.6
warn = Get away from here! This is my place! I WILL shoot!|Back off! Last warning!|I see you! Walk away!
freeze = FREEZE! Hands where I can see them!|Freeze! Don't you move!
describe = A security guard who took the police gun safe. Scared, which makes him dangerous.
greet = Keep those hands up. ...Who are you? What do you want here?
parley = ...Okay. Okay. Stay where you are and keep your hands up. What do you want?
want = painkillers
want_count = 2
want_text = My back's gone. I can barely stand watch. Two packs of painkillers and maybe I'll believe you're not one of them.
thanks = ...Thank you. God, thank you. All right - come in. Slowly. Here, I don't need all of these.
reward = pistol_ammo:1
let_in_trust = 5
let_in = Fine. Come in. Slowly - and if you try anything, I won't miss.
keep_out = No. Not a chance. Prove you're not with those raiders first.
hello = You came back. Good. It's quiet in here.
chat = I lock the door every night and still don't sleep.|The raiders tried the back door last week. I fired one shot. They haven't been back.|There are cartridges in the safe. Not for strangers.|Every night I check the locks three times. Then once more.|I found the duty roster. My name isn't on it. Nobody's is any more.
leads = kalle, robin
gender = man
hair_style = 0
about = Securitas, twelve years. Shopping centres, mostly. Nothing ever happened. Until it did.|I came here because the station had a gun safe. That's the kind of thinking that keeps you alive.|My daughter is eleven. She's with her mother in Lerum. I could walk there in a day. I haven't.|I shot at someone. Back in the first week. I still don't know if I hit them.|I don't trust people. I'm trying. You're making it hard not to.
happened = There was a folder in the chief's office. Every police station got one, two weeks before. Instructions: if a certain code came over the radio, escort named officials to shelters and close the roads. The code came on day four. There was nobody left to drive.
happened_lore = the_bunkers
friend_chat = You know what the worst part of guard work was? The waiting. Now it's all waiting.|I counted the rounds again. Forty-one. Don't tell anyone.|Lerum's just down the E20. Maybe one day you'll walk there with me.
close_chat = I'm sorry I pointed a gun at you. When we met. I think about that.|You're the reason I sleep now. Sometimes.
lover_chat = I never let anyone close. Look at me now.|Lock the door tonight. With both of us on this side of it.
idle = Front door: locked. Back door: locked. Front door...|Forty-one. Forty-one.|Nobody's coming. Nobody's coming.
morning = *rubs eyes* Did I sleep? I slept. Something's wrong.
flirt_yes = I... don't know what to say to that. Say it again sometime.
flirt_no = Don't. I can barely keep myself together as it is.
bedtime = 2
wakeup = 6

