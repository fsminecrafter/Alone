wear = tshirt, wool_sweater, rain_jacket, jeans, hiking_boots
carry = candles:2, matches:2, crispbread:2, canned_soup:1, final_edition:1
hp = 50
greet = Welcome, welcome. Come in out of the rain - the door's never locked. I'm Anders. I'm the vicar, for what it's worth now.
hello = Ah, it's you. Sit, sit. The pews are hard but they're dry.
chat = I ring the bell every Sunday at eleven. You're the first person who's ever come.|I've buried no one. That's what I can't understand. There's no one to bury.|The organ still works if you pump it. I'm terrible at it.|People left their prayers in the box by the door that last week. I've been reading them. I hope that's all right.
want = candles
want_count = 3
want_text = I'm running out of candles. It's silly, I know. But I promised myself the church would never be dark.
thanks = Thank you. There. Now it won't be dark tonight either. Please - take these, I have more than I can eat.
reward = canned_soup:2, crispbread:2, matches:1
leads = maja, lars_erik
lead_text = There's a young woman living in the lab at the lasarett - Maja. She came to me once to ask if God could forgive a mistake she didn't know she was making. And old Lars-Erik out at Bälinge, he brings me potatoes.
can_join = false
refuse_text = Someone has to keep the light on. Someone might still come.
describe = The vicar of Christinae kyrka. Keeps the candles burning.
gender = man
hair_style = 0
romanceable = false
happened = It was eight days. I counted them in the parish book. On the first day I had four funerals booked. On the third day people came to the church who hadn't been in years. On the sixth day the paper came out with half its pages blank. On the eighth day the bells in Göteborg stopped. Mine didn't.
happened_lore = eight_days
about = I came to Alingsås twenty years ago. I thought it would be a quiet parish.|I'm not sure I believe the same things I did a month ago. I still light the candles.|My sister is a doctor in Uppsala. Was. Is. I don't know which word to use.
friend_chat = You know, I think I've talked more to you than to God this week. Don't tell Him.|Come by on Sunday. Eleven o'clock. I'll ring the bell just for you.
idle = The Lord is my shepherd... the Lord is... hm.|One more candle. Just one more.|Is anyone there? ...No. Never mind.
night = Who - ah. Ah, it's you. Do you need a place to sleep? Take a pew.|It's late, friend. Is something wrong?
morning = *yawns* Morning. Coffee is a sin I can no longer commit.
bedtime = 22
wakeup = 6

[oskar]
name = Oskar Wahlberg
age = 22
bio = A conscript from Skaraborg's regiment. His platoon was sent to guard a supply drop in the forest the week it started. He's the only one who walked out.
disposition = wary
home = district:Maryd
roam = 12
skin = #f0caa8
hair = #b08a50
wear = tshirt, m90_jacket, m90_trousers, combat_boots
weapon = hunting_knife
carry = field_ration:2, ammo_556:1, compass:1, matches:1
hp = 65
aim = 0.7
greet = Halt! ...Sorry. Habit. You're not - you're not one of the lorry drivers, are you? No. Nobody's a lorry driver any more.
hello = Hey. Still breathing? Good.
chat = I keep my boots on when I sleep. Two minutes to move out, that's what they drilled into us.|I haven't fired a shot since it started. Not once. Nothing to shoot at.|The lake's full of perch if you've got the patience. I haven't.|I still check my watch at 0600. Every day.
want = hunting_rifle
want_count = 1
want_text = I left my rifle with the others. A hunting rifle would do - anything I can hit something with. I feel naked without one.
thanks = Now that's a proper weapon. Thanks. I owe you - and I'll pay you back better than this.
reward = field_ration:3, ammo_556:1
reveal = building:Militärcontainer
reveal_name = Military container
reveal_trust = 30
reveal_text = All right. You've earned this. There's a container - army green, twelve metres - out in the big forest between the lakes and the Maryd road. Supplies for a unit that never came: crates of rations, kit, weapons. We were sent to guard it. When the radio went quiet the others went home to their families. I've marked it on your map. Go before someone else finds it.
leads = lars_erik
lead_text = The old farmer out at Bälinge gave me potatoes once and didn't ask questions. Lars-Erik.
can_join = true
join_trust = 40
join_text = Finally. Point me at something useful to do.
refuse_text = Not yet. I'm still figuring out if you're the kind of person who gets people killed.
describe = A young soldier in camouflage, out near Maryd. Jumpy.
gender = man
hair_style = 4
happened = The order came on day two: "Secure the supply point, hold until relieved." Nobody came to relieve us. On day five the lieutenant got a call on the field phone, sat down on a crate and didn't get up again. By day eight there was nobody on the radio but a test tone. I walked out of the forest with my rifle. I left it on the road somewhere. I don't remember where.
happened_lore = eight_days
about = Grew up in Skövde. My mum's a dental nurse. Was.|I signed up because my friends did. Nine months, they said. Then university.|I'm not brave. I just do what the last order said, because nobody's given me a new one.
friend_chat = Want to learn to field-strip a rifle blindfolded? It's the one useful thing I know.|You're the first person in weeks who's asked my name. Not my rank. My name.
close_chat = If anything happens, you take the container. All of it. Promise.|I think I'd have gone mad out here on my own. Thanks for showing up.
idle = Left, right, left... god, I'm talking to myself again.|0600. Wake up, soldier.|Ration number four. Again.
night = Halt! Who goes - oh. You. Don't do that.|*hand on the knife* ...It's you. Okay. Okay.
morning = *already lacing his boots* Morning.
bedtime = 22
wakeup = 6
