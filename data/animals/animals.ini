# Wildlife around Alingsås.
#   hp, speeds in m/s, sense = how far it notices you (metres, quiet walking),
#   flee = distance it keeps from people, aggression 0..1 (chance to charge
#   instead of running), habitat = map zones it lives in, density = animals
#   kept within 200 m of the player, yields = item:count produced by butchering

