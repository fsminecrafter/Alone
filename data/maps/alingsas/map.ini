# Alingsås, Västra Götaland, Sweden.
# Digitised from a map screenshot with tools/mapgen/digitize.py.
# All coordinates in roads.txt / features.txt are map pixels; the game
# converts them to metres (1 tile = 1 metre).

[map]
osm_features = osm_features.txt
roads_metres = roads_m.txt
terrain_osm_metres_per_pixel = 2.0
terrain_osm = terrain2m.pgm
name = Alingsås
terrain = terrain.pgm
roads = roads.txt
features = features.txt
# 500 m on the reference scale bar = 73 px
metres_per_pixel = 6.85
# Where a new game starts (map pixels): a house in Nolhaga, west of Centrum
spawn = 560 352
# Real-world latitude, used for daylight hours
latitude = 57.93
