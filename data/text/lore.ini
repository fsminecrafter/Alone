# data/survivors/survivors.ini), and shows in the journal under "What happened".
#   title, text, order (story order in the journal)

[un_meeting]
order = 1
title = The emergency meeting
text = Years ago the UN called the world's leaders to a closed emergency session on the climate. The scientists gave them two options and no third. Either every plastic factory, every petrol car and every coal and oil power plant would be shut down - or eighty percent of the civilian population would have to go. The minutes were sealed. Most of the room refused to even vote on the second option.

[the_breach]
order = 2
title = The breach
text = The sealed minutes did not stay sealed. A private company - Veyra Systems, a name nobody outside the industry had heard - got hold of them through a data breach. Veyra read option two as a business plan. Within a year it had quiet backing from several of the largest corporations in the world: money, labs, shipping, people in governments who looked the other way.

[the_tests]
order = 3
title = The tests
text = They spent twenty years testing. 2006: a gas test over New York, written off as an industrial accident. 2012: toxic water in Berlin, a "contaminated reservoir". 2020: Virus test 1, over Beijing. 2026: Virus test 2, over Stockholm. In the internal schedule the last line has one word stamped across it in red: BREACHED.

[the_farm]
order = 4
title = The farm
text = Every test started the same way: one farm in the countryside, far from anything. The people living there were the "participants". They were watched day and night and nobody was allowed to visit - cars that tried to drive in broke down on the road, tractors would not start, the phone lines went dead. Sabotage, all of it, so the results stayed clean. For test 2 they picked a grain farm in Uppland, an hour north of Stockholm.

[the_spread]
order = 5
title = How it spread
text = What the scientists had not understood was how easily it moved. It spread through touch, through the air, through water, through blood - through everything. The farmer walked through his own fields. From a few crops it went into the grain, from the grain to the mill, from the mill to the bread, and from the bread to people all over the country. The farmer died three days later.

[eight_days]
order = 6
title = Eight days
text = By the time the researchers sat down to look over the results, it was already in every major city. Eight days after the test, 99.99 percent of the world's people were gone. The radio went quiet in the afternoon of the eighth day. Nobody has seen a plane since.

[the_bunkers]
order = 7
title = The bunkers
text = Not everyone was caught out. Some officials had been told just enough to run. They sealed themselves into government shelters before the end, and some of them are still down there, living on stored food and filtered air. One of those shelters is under the forest at Hjortmarka, east of Alingsås.
