# Symptoms the player can feel. The game never tells the player *why* they
# feel this way: only what it feels like. Each symptom reads one body signal
# (0..1) and shows one of four levels once the signal passes a threshold.
#
#   signal      body signal to read (see BodySignals in src/survival/Body.h)
#   thresholds  four ascending values, one per level
#   colour      ui tint: warm (yellow->red), cold (blue), neutral (grey)
#   nameN/descN text for level N (hover tooltip)

[hunger]
signal = hunger
thresholds = 0.3, 0.5, 0.75, 0.95
colour = warm
name1 = Peckish
desc1 = You could eat something.
name2 = Hungry
desc2 = Your stomach growls. Food is starting to occupy your thoughts.
name3 = Very hungry
desc3 = A hollow, gnawing ache. It's hard to think about anything but food.
name4 = Ravenous
desc4 = Your body is screaming for food. Your hands tremble when you reach for things.

[craving]
signal = craving
thresholds = 0.2, 0.4, 0.65, 0.85
colour = warm
name1 = Unsatisfied
desc1 = You've eaten, but somehow it didn't quite hit the spot.
name2 = Craving
desc2 = You keep daydreaming about rich, heavy food. Nothing you eat seems to fill you.
name3 = Strong cravings
desc3 = You'd trade anything for something rich and greasy. Every meal leaves you hungrier.
name4 = Obsessive cravings
desc4 = You eat and eat and feel no fuller. Your body wants something you aren't giving it.

[thirst]
signal = thirst
thresholds = 0.08, 0.3, 0.55, 0.8
colour = warm
name1 = Thirsty
desc1 = Your mouth feels a little dry.
name2 = Very thirsty
desc2 = Your lips are dry and you can't stop thinking about water.
name3 = Parched
desc3 = Your tongue sticks to the roof of your mouth. Your head pounds.
name4 = Desperately parched
desc4 = Your skin feels papery and your thoughts are sluggish. You need water now.

[full]
signal = full
thresholds = 0.15, 0.5, 0.8, 0.95
colour = neutral
name1 = Satisfied
desc1 = Pleasantly fed.
name2 = Full
desc2 = You couldn't eat much more.
name3 = Stuffed
desc3 = Your belt is too tight. Eating more would be a bad idea.
name4 = Painfully full
desc4 = Your stomach is stretched taut. You feel like you might bring it all back up.

[nausea]
signal = nausea
thresholds = 0.15, 0.35, 0.6, 0.85
colour = warm
name1 = Feeling queasy
desc1 = Something feels slightly off in your stomach. Probably nothing.
name2 = Queasy
desc2 = A persistent unease sits in your gut. Food seems less appealing.
name3 = Nauseous
desc3 = Waves of nausea roll over you. You might throw up if you push it.
name4 = Retching
desc4 = You can barely keep anything down. Your stomach heaves at the thought of food.

[cramps]
signal = cramps
thresholds = 0.15, 0.35, 0.6, 0.85
colour = warm
name1 = Rumbling stomach
desc1 = Your bowels are gurgling and restless.
name2 = Stomach cramps
desc2 = Sharp twinges in your belly come and go. You keep needing to find somewhere private.
name3 = Bad cramps
desc3 = Your gut twists painfully and often. You're losing a lot of fluid.
name4 = Severe cramps
desc4 = You're doubled over. You can't stay away from a toilet for long, and you feel drained.

[weakness]
signal = weakness
thresholds = 0.15, 0.35, 0.6, 0.85
colour = warm
name1 = Sluggish
desc1 = Your limbs feel a bit heavier than they should.
name2 = Weak
desc2 = Everything takes more effort. Carrying things tires you quickly.
name3 = Very weak
desc3 = Your legs wobble when you stand. Even small tasks wear you out.
name4 = Barely standing
desc4 = You have almost nothing left. Every step is a struggle.

[headache]
signal = headache
thresholds = 0.15, 0.35, 0.6, 0.85
colour = warm
name1 = Dull headache
desc1 = A faint pressure behind your eyes.
name2 = Headache
desc2 = A steady throbbing in your head.
name3 = Pounding headache
desc3 = Your head pounds with every heartbeat. Light hurts.
name4 = Splitting headache
desc4 = The pain in your skull is overwhelming. It's hard to focus on anything.

[dizziness]
signal = dizziness
thresholds = 0.15, 0.35, 0.6, 0.85
colour = warm
name1 = Lightheaded
desc1 = Standing up too fast makes your vision dim for a moment.
name2 = Dizzy
desc2 = The ground seems to tilt slightly. You steady yourself on things.
name3 = Very dizzy
desc3 = The world spins when you move. You stumble.
name4 = Room spinning
desc4 = You can barely keep your balance. You feel like you might pass out.

[confusion]
signal = confusion
thresholds = 0.15, 0.35, 0.6, 0.85
colour = warm
name1 = Foggy
desc1 = Your thoughts are a little slow.
name2 = Confused
desc2 = You keep losing your train of thought. Simple decisions feel hard.
name3 = Disoriented
desc3 = You aren't quite sure where you are or what you were doing.
name4 = Delirious
desc4 = Nothing makes sense. You can't trust your own mind.

[cold]
signal = cold
thresholds = 0.1, 0.3, 0.55, 0.8
colour = cold
name1 = Chilly
desc1 = A little cold. You hunch your shoulders.
name2 = Cold
desc2 = You're shivering and your fingers are getting clumsy.
name3 = Freezing
desc3 = You're shaking violently and your hands barely work.
name4 = Numb with cold
desc4 = The shivering has slowed. You feel strangely calm and very, very tired.

[hot]
signal = hot
thresholds = 0.1, 0.3, 0.55, 0.8
colour = warm
name1 = Warm
desc1 = You're starting to sweat.
name2 = Hot
desc2 = Sweat runs down your back.
name3 = Overheating
desc3 = Your face is flushed and your heart is racing.
name4 = Burning up
desc4 = You feel faint and sick from the heat.

[fever]
signal = fever
thresholds = 0.1, 0.3, 0.55, 0.8
colour = warm
name1 = Flushed
desc1 = Your face feels warm, but you feel a little shivery.
name2 = Feverish
desc2 = Hot and cold at the same time. Your skin is clammy.
name3 = High fever
desc3 = You're burning up and shivering under your clothes. Your whole body aches.
name4 = Raging fever
desc4 = You're drenched in sweat, shaking, and your thoughts drift.

[tired]
signal = tired
thresholds = 0.1, 0.35, 0.65, 0.9
colour = neutral
name1 = Drowsy
desc1 = You yawn more than usual.
name2 = Tired
desc2 = Your eyelids are heavy. A good sleep would help.
name3 = Very tired
desc3 = You're running on fumes. Your reactions are slow.
name4 = Can barely keep eyes open
desc4 = You could fall asleep standing up.

[pain]
signal = pain
thresholds = 0.1, 0.3, 0.55, 0.8
colour = warm
name1 = Aching
desc1 = Something hurts, a little.
name2 = Painful
desc2 = The pain makes you wince when you move.
name3 = Very painful
desc3 = The pain is hard to ignore. It slows you down.
name4 = Agony
desc4 = The pain blots out almost everything else.

[aches]
signal = aches
thresholds = 0.15, 0.35, 0.6, 0.85
colour = warm
name1 = Stiff
desc1 = Your joints feel stiff.
name2 = Achy
desc2 = Your muscles and joints ache.
name3 = Sore all over
desc3 = Every muscle hurts, even when resting.
name4 = Wracked with pain
desc4 = Your whole body aches deeply. Moving is torture.

[mouth]
signal = mouthSore
thresholds = 0.1, 0.35, 0.6, 0.85
colour = warm
name1 = Tender gums
desc1 = Your gums feel a little sore when you chew.
name2 = Bleeding gums
desc2 = Your gums bleed easily. Little bruises appear where you don't remember bumping.
name3 = Loose teeth
desc3 = Your gums are swollen and spongy. A tooth feels loose. Old scars ache.
name4 = Rotting gums
desc4 = Your mouth is a mess of swollen, bleeding gums. Bruises cover your legs.

[skin]
signal = skin
thresholds = 0.15, 0.4, 0.65, 0.9
colour = warm
name1 = Sallow
desc1 = You look a little off-colour.
name2 = Yellowish skin
desc2 = The whites of your eyes have a yellow tint.
name3 = Jaundiced
desc3 = Your skin is distinctly yellow and you itch all over.
name4 = Deeply jaundiced
desc4 = Your skin and eyes are deep yellow. Your belly feels swollen.

[glands]
signal = swollenGlands
thresholds = 0.15, 0.35, 0.6, 0.85
colour = warm
name1 = Tender lump
desc1 = There's a tender spot under your arm.
name2 = Swollen lump
desc2 = A swollen, painful lump has formed under your arm.
name3 = Large swelling
desc3 = The lump is large, hot and very painful.
name4 = Angry swelling
desc4 = Several lumps have swollen up. You feel very unwell.

[hallucination]
signal = hallucination
thresholds = 0.1, 0.3, 0.55, 0.8
colour = neutral
name1 = Odd
desc1 = Colours seem slightly too bright.
name2 = Seeing things
desc2 = Shapes move at the edge of your vision.
name3 = Hallucinating
desc3 = You see and hear things you're fairly sure aren't there.
name4 = Lost in visions
desc4 = You can't tell what's real any more.

[bleeding]
signal = bleeding
thresholds = 0.01, 0.2, 0.5, 0.8
colour = warm
name1 = Bleeding lightly
desc1 = Blood is seeping from a wound.
name2 = Bleeding
desc2 = A wound is bleeding steadily.
name3 = Bleeding heavily
desc3 = Blood is pouring from a wound. You need to stop it.
name4 = Bleeding out
desc4 = You're losing blood fast. Stop it now.
