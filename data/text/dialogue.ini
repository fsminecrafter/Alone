# Lines anyone can say. Sections are topics, keys are how close you are:
#   enemy, stranger, acquaintance, friend, bestfriend, family, lover, any
# A missing key falls back: lover/family -> bestfriend -> friend -> any.
# | separates alternatives. {name} is your name, {time} morning/afternoon/evening/night.
# People's own lines in data/survivors/survivors.ini come first where they have them.

[intro]
any = And you are...? {name}. Nice to meet you, {name}.|What's your name? ...{name}. Good. A name makes it real.|You've got a name? {name}. I'll remember it.

[hello]
enemy = You've got some nerve showing your face here.|What. Do you. Want.|Make it quick, then get out of my sight.
friend = {name}! Get in here.|There you are. I was starting to worry.|Good {time}, {name}. You look like you've been busy.|Hey, you. Come in, sit down.|Oh good, it's you.
bestfriend = {name}! I was just thinking about you.|There's my favourite person in all of Alingsås.|I saved you a seat. And the last of the coffee.|You came back. You always come back.
family = Hey, you. Welcome home.|There you are - I kept the candle going for you.|{name}. Sit down, you look frozen.
lover = There you are. I missed you.|Hi, you. Come here.|{name}... I hate it when you're out there for so long.|I kept thinking I heard your steps. And now you're here.

[concern]
bleeding = You're bleeding! Sit down - let me look at that.|God, {name}, you're dripping blood. Bandage that. Now.
hurt = You're limping. What happened out there?|You look like you've been through a wall.|Don't tell me you're fine. I can see it.
cold = You're blue around the lips. Come closer to the warm.|Your hands are shaking. When did you last get properly warm?
sick = You look feverish. Have you been drinking from the lake?|You're grey, {name}. Are you sick?
tired = When did you last sleep? You look dead on your feet.|Your eyes are half shut. Get some rest.
hungry = You've lost weight. Are you eating?|I can hear your stomach from here.

[chat]
any = Some mornings I forget, for a second. Then I remember.|I keep counting the tins. As if counting makes more.|The crows have got fat this autumn. Funny, that.|I miss music. Real music, not humming.|I talk to the houses on the way past. "Hello, number twelve." Is that mad?|Do you ever wonder where they all went? I've stopped asking out loud.|It's so quiet at night I can hear Säveån from here.|I found a shopping list in a coat yesterday. Milk, bread, birthday candles. I had to sit down.|We'll get by. People always have.
stranger = Fine. Considering.|I manage.|Do you want something, or are you just looking?|Not much to say, really.
acquaintance = Better, now that I know someone else is out there.|One day at a time. That's how it's done, isn't it?|Did you see the geese go over? Heading south. Smart birds.|I've started keeping a diary. Mostly weather.
friend = Honestly? Better on the days you come by.|I made a list of things to do when it's all over. "Go to the cinema" is number one.|I dreamt the trains were running again. I woke up so happy.|You know what I miss? Strangers. People I'd never talk to. Now I'd hug them.|I tried to make bread. It's more of a brick. Want some brick?
bestfriend = I don't know what I'd do if you stopped coming.|Can I tell you something? I'm scared most of the time. Just not when you're here.|Remember when we first met? I almost hit you with a chair.|If we make it to spring, we're having a party. Two people is a party.|You're the only one I don't have to pretend with.
lover = I like the quiet now. When it's the two of us.|I counted the freckles on your hand while you were asleep. Don't laugh.|When this is over, let's take the train somewhere. Anywhere.|Every time you go out I make myself a promise not to worry. Every time I break it.|You smell like woodsmoke and rain. I like it.
rain = Listen to that rain. At least the barrels will be full.|Wet again. Everything I own smells of wet wool.|Rain like this, nobody's out. Not even the raiders.
snow = Snow. It's beautiful. And it's going to kill somebody.|The snow shows every track. Watch where you walk.|First snow. When I was small we'd have run outside screaming.
cold = It's getting cold. Proper cold. Have you got wood put by?|My fingers haven't been warm in a week.|If the winter's like last year, we need twice the firewood.
night = It's late. You shouldn't be walking around in the dark.|At night the town sounds different. Like it's holding its breath.|I can't sleep much these days. Too many noises.
morning = Morning. Have you eaten?|I like mornings. The light makes it all look normal.|Up early? Me too. Old habits.

[about]
none = That's about all there is to me. Now you know everything.|You've heard my whole life story now. Not much of a book.
notyet = Maybe another time. I don't know you that well yet.|Hm. Let's not get into that just now.|Ask me again when we know each other better.

[joke]
good = Ha! Oh, that's terrible. I love it.|*snort* ...I didn't laugh. You didn't see that.|Ha ha! God, I needed that.|That's so bad it's good. Tell me another tomorrow.|I haven't laughed in weeks. Thank you.
bad = ...I don't get it.|That's not funny. People are dead, {name}.|Is that... supposed to be a joke?|Hm. Maybe keep the day job. Whatever that is now.

[flirt]
yes = Oh! Well... thank you. You're not so bad yourself.|*laughs* Stop it. ...Don't stop it.|You're sweet, you know that?|I wasn't expecting that. I'm not complaining, though.
warm = You always know what to say. Come sit closer.|I've been hoping you'd say something like that.|Careful, {name}. I might start believing you.
no = Ha. ...Let's just keep things simple, okay?|That's... kind. But no.|I don't think of you like that. Sorry.|Can we not? Things are complicated enough.

[kin]
yes = That means a lot. More than you know.|You know... I believe you.|*nods slowly* Same goes for you. Always.|It's been a long time since anyone said that to me.
warm = You feel like family, {name}. Like the people I had.|Sometimes I forget we only met this autumn.|Whatever happens, we stick together. That's what family does.
no = ...Let's not make promises. People keep dying.|I don't know. I don't let people in like that. Not yet.|Hm. Maybe. Ask me again when we've been through more.

[confess]
yes = ...Me too. I've been afraid to say it. Come here.|I know. I've known for a while. I feel the same.|In the middle of the end of the world. Of course it would be now. Yes. Yes, me too.
no = I... I'm sorry. I care about you. Just not like that.|Oh, {name}. I wish I felt the same way. I don't. I'm sorry.
family = Oh, {name}... you're like family to me. I could never think of you like that.|What? No - you're family. That would be... strange. Sorry.

[family]
yes = ...Family. Yes. I think you are.|I lost my family. I didn't think I'd get another. Thank you.|Then you'd better start acting like it - eat something.
no = Family? We barely know each other.|Let's not get ahead of ourselves.
romance = Family? I... thought we were something else. Something more.|Is that all I am to you? Family? ...Okay.

[hug]
friend = Oh - okay. Yeah. Thanks, I needed that.|*squeezes back* Don't let go just yet.
family = *holds on tight* We're going to be all right. All of us.|You always know when I need that.
lover = Mm. Stay a while. The world can wait.|*rests their head on your shoulder* Just like this. A little longer.|I could fall asleep like this.

[gift]
family = Here - I found this and thought of you.|I put this aside for you. Don't argue.
lover = I saved this for you. Don't make that face, just take it.|For you. I know you'll need it more than me.

[breakup]
any = ...Oh. Okay. If that's what you want.|I see. I'll... be fine. Friends, then.|That hurts, {name}. But I'd rather you were honest.

[sorry]
ok = ...Fine. I'm still angry. But fine.|All right. Let's start over. Carefully.
no = Sorry doesn't fix it. But I heard you.|Words are cheap. Show me.

[night]
firstmeet = AAH! Who - who are you? What are you doing in my house in the middle of the night?! ...You're alive. Okay. Okay. I'm breathing.
stranger = Wha - who's there? Get OUT! ...Oh. It's you. What are you doing here at this hour?|*jolts awake* Don't come any closer! ...It's the middle of the night!
acquaintance = Mm... what? It's the middle of the night, {name}.|Couldn't this have waited till morning?
friend = Mmh... {name}? Is something wrong?|Couldn't sleep either? ...What is it?
bestfriend = *yawns* Hey. Bad dream? Sit down.|{name}... you okay? It's late.
lover = Mm, there you are... come here, it's cold.|*sleepily* Is it morning? No? Then come back to bed.

[sleep]
back = *yawns* Night, {name}.|Mm. Lock the door on your way out.|Already asleep...

[woken]
noise = Who's there?! I've got a knife!|What was that? Hello?!
noise_known = What - oh. It's you, {name}. You scared me half to death.|Is that you, {name}? Do you know what time it is?

[goodnight]
any = I'm going to bed. You should go.|It's late. I'm turning in.
friend = I'm off to bed, {name}. Stay if you want - the sofa's yours.|Goodnight, {name}. Don't go out in the dark.

[morning]
any = *stretches* Morning already.|Ugh. Another cold morning.|Right. Coffee. Or what passes for coffee.

[idle]
any = Where did I put the matches...|Hmm hmm hmm...|One, two, three tins. Four. Four tins.|Need to fix that window.|*sighs*|Come on, come on...|That's the last of the candles.|Cold in here.

[bye]
friend = See you later, {name}. Be careful.|Come back soon.|Don't do anything stupid out there.
bestfriend = Come back in one piece, you hear me?|Go on, then. I'll be here.|Love you, idiot. Go.
family = Be careful. I mean it.|Come home before dark.
lover = Come back to me.|Be safe. Please.|*kisses your cheek* Go on. Before I stop you.

[join]
family = Family sticks together. I'm coming.|For you? I'll lock the door behind me.
lover = Did you think I'd let you go alone?|Always. Wherever you're going.

[follow]
friend = Lead the way.|Right behind you, {name}.|Let's go.

[wait]
friend = I'll wait. Don't make me come looking for you.|Here? Fine. Don't be long.

[dismiss]
lover = I'll be at home. Come back to me soon.

[companion]
any = Did you hear that?|My feet are killing me.|Where are we going, anyway?|It's strange, walking down the middle of the road.|Look - smoke? No... just mist.|I used to drive this way to work.|Do you know where you're going?
close = I'm glad I'm out here with you.|Remember when this street had traffic?|If anything happens, we stick together. Deal?
night = We should find somewhere to sleep.|I can't see a thing. Stay close.|Something's moving over there. Probably a deer. Probably.
rain = I'm soaked to the bone.|Let's get out of this rain.|Water down my neck. Lovely.
hurt = You're bleeding - stop and patch yourself up!|Let me look at that wound when we stop.

# In a tent together, before sleep ("Let's sleep now")
[tent_in]
any = Cosy. Mind your elbows.|Two in a tent. Like a school trip, minus the teachers.|At least it's out of the wind. Budge up.
bestfriend = Like old times. Even though we don't have any old times.|I'll take the side with the lumpy ground. You owe me.
lover = Hi. ...It's small in here, isn't it. I don't mind.|Just us and the rain on the roof.|Come here. You're freezing.

[tent_sleep]
any = Night, {name}. I'll sleep light.|Good night. Wake me if you hear anything.|Night. Try not to snore.
lover = Good night, love. Stay close.|Night. ...I'm glad it's you in here.|Sleep. I've got you.

[tent_hold]
lover = *settles against you* ...You're warm. Don't move.|*pulls the sleeping bag over you both* There. Better.|*your heartbeat slows with theirs* I could stay like this until spring.|Mm. This is the first time in months I haven't been cold.

[tent_whisper]
lover = Do you ever think about what we'll do when it's over? I think about a little house. With you in it.|Before all this, I never would have spoken to you. Isn't that strange?|When you're out there, I count the hours. I know exactly how many it's been.|Listen. The rain. It sounds almost kind, from in here.|Promise me something. Whatever happens, we don't split up.

# "What happened?" once someone has told you all they know (or knows nothing)
[happened]
any = It was so fast. A cough on the news on the Monday. By the next week the radio was just static.|Eight days, they say. I wasn't counting. I was hiding.|I don't know. Nobody knows. Some people say it started on a farm. Some say it was made.|I heard officials got into bunkers before the end. Of course they did.|One day there were people. Then there weren't. I stopped trying to understand it.
friend = I've told you everything I know, {name}. The rest you'll have to find in the papers they left behind.|Sometimes I think it's better not to know who did it. Then I think - no. Someone should have to answer for it.
bestfriend = I keep thinking - if anyone ever finds out who did this, I want to be there when they do. You and me.
