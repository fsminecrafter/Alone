<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alone</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; color: #e2ded4; overflow: hidden;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; background: #0d0f12; cursor: default; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 14px; background: #0d0f12; }
  #loading h1 { margin: 0; font-size: 56px; letter-spacing: 6px; font-weight: 700; }
  #loading p { margin: 0; color: #d6a85c; }
  #bar { width: min(420px, 80vw); height: 6px; background: #2a2d31; border-radius: 3px; overflow: hidden; }
  #fill { width: 0; height: 100%; background: #d6a85c; transition: width .2s; }
  #status { color: #96948c; font-size: 14px; }
</style>
</head>
<body>
<div id="loading">
  <h1>ALONE</h1>
  <p>Alingsås, Västra Götaland. Autumn.</p>
  <div id="bar"><div id="fill"></div></div>
  <div id="status">Loading…</div>
</div>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
  var fill = document.getElementById('fill'), statusEl = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); (window.__log = window.__log || []).push(t); },
    printErr: function (t) { console.warn(t); (window.__log = window.__log || []).push(t); },
    setStatus: function (t) {
      if (!t) return;
      var m = t.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
      if (m) fill.style.width = (100 * m[1] / m[2]) + '%';
      statusEl.textContent = t.replace(/\(.*\)/, '').trim() || 'Loading…';
    },
    onRuntimeInitialized: function () {
      document.getElementById('loading').style.display = 'none';
      Module.canvas.focus();
    }
  };
  // For testing: alone.html?args=--screenshots&env=ALONE_SHOTS=game,camp
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.get('args')) Module.arguments = q.get('args').split(' ');
    if (q.get('env')) {
      Module.preRun = Module.preRun || [];
      Module.preRun.push(function () {
        q.get('env').split(';').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) ENV[kv.slice(0, i)] = kv.slice(i + 1); });
      });
    }
  })();
  window.onerror = function (msg) { statusEl.textContent = 'Something went wrong: ' + msg; };
  // Fullscreen: the game asks, the next click or key press does it (browsers
  // only allow it from inside an input event)
  var wantFs = null;
  Module.fullscreenPending = false;
  Module.setFullscreen = function (on) {
    var isOn = !!document.fullscreenElement;
    if (!!on === isOn) { wantFs = null; Module.fullscreenPending = false; return; }
    wantFs = !!on;
    Module.fullscreenPending = true;
  };
  Module.fullscreenState = function () { return document.fullscreenElement ? 1 : 0; };
  function applyFs() {
    if (wantFs === null) return;
    var on = wantFs;
    wantFs = null;
    Module.fullscreenPending = false;
    var el = document.documentElement;
    if (on && !document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function () {});
    if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
  }
  ['mouseup', 'keyup', 'touchend'].forEach(function (e) { window.addEventListener(e, applyFs); });
  // Browsers only allow sound after a click or key press
  ['mousedown', 'keydown', 'touchstart'].forEach(function (e) {
    window.addEventListener(e, function () { Module.canvas.focus(); }, { once: true });
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
