name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test (screenshots)
        working-directory: build
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./alone --screenshots --seed 7
      - uses: actions/upload-artifact@v4
        with:
          name: alone-linux
          path: |
            build/alone
            build/data
            build/screenshot_*.png

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release -j4
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: alone-windows
          path: |
            build/Release/alone.exe
            build/Release/data

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-web -j4
      - uses: actions/upload-artifact@v4
        with:
          name: alone-web
          path: |
            build-web/alone.html
            build-web/alone.js
            build-web/alone.wasm
            build-web/alone.data
      # The site for GitHub Pages: the game is the front page
      - name: Prepare site
        run: |
          mkdir -p site
          cp build-web/alone.js build-web/alone.wasm build-web/alone.data site/
          cp build-web/alone.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishes the web version on GitHub Pages (pushes to the default branch only).
  # One-time setup: repository Settings > Pages > Source: "GitHub Actions".
  pages:
    needs: web
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
