name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test (screenshots)
        working-directory: build
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./alone --screenshots --seed 7
      - uses: actions/upload-artifact@v4
        with:
          name: alone-linux
          path: |
            build/alone
            build/data
            build/screenshot_*.png

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release -j4
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: alone-windows
          path: |
            build/Release/alone.exe
            build/Release/data
